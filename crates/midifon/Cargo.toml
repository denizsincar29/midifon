[package]
name = "midifon"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "midifon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
midifon-core = { path = "../midifon-core" }
wxdragon = "0.9"
prismer = { version = "0.1", features = ["static"] }

[build-dependencies]
embed-manifest = "1.4"
